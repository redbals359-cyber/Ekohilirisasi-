<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Trend & Meme Radar</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
    }

    header {
      max-width: 1100px;
      margin: 0 auto 30px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      border-bottom: 1px solid #334155;
      padding-bottom: 20px;
    }

    .title-section h1 {
      font-size: 1.8rem;
      color: var(--accent-color);
    }

    .title-section p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    select {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid #334155;
      padding: 10px 14px;
      border-radius: 8px;
      outline: none;
      cursor: pointer;
    }

    button {
      background-color: var(--accent-color);
      color: #0f172a;
      font-weight: bold;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button:hover {
      filter: brightness(1.1);
    }

    button:active {
      transform: scale(0.97);
    }

    .grid-container {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background-color: #0f172a;
    }

    .card-content {
      padding: 15px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-title {
      font-size: 1rem;
      line-height: 1.4;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .card-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-link {
      display: inline-block;
      margin-top: 12px;
      color: var(--accent-color);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .card-link:hover {
      text-decoration: underline;
    }

    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: #0f172a;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header>
    <div class="title-section">
      <h1>Radar Tren & Meme Harian</h1>
      <p id="date-display">Memuat tanggal...</p>
    </div>
    <div class="controls">
      <select id="subreddit-select">
        <option value="memes">r/memes</option>
        <option value="dankmemes">r/dankmemes</option>
        <option value="wholesomememes">r/wholesomememes</option>
        <option value="funny">r/funny</option>
      </select>
      <button id="btn-refresh">
        <span id="btn-text">Refresh</span>
      </button>
    </div>
  </header>

  <main class="grid-container" id="grid-container">
    <div class="status-msg">Mengambil data tren terbaru...</div>
  </main>

  <script>
    const gridContainer = document.getElementById('grid-container');
    const btnRefresh = document.getElementById('btn-refresh');
    const btnText = document.getElementById('btn-text');
    const subredditSelect = document.getElementById('subreddit-select');
    const dateDisplay = document.getElementById('date-display');

    let currentLoadedDate = new Date().toDateString();

    function updateDateLabel() {
      const today = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      dateDisplay.textContent = `Tren Hari Ini: ${today.toLocaleDateString('id-ID', options)}`;
    }

    function checkDailyReset() {
      const todayStr = new Date().toDateString();
      if (currentLoadedDate !== todayStr) {
        currentLoadedDate = todayStr;
        updateDateLabel();
        fetchTrending();
      }
    }

    async function fetchTrending() {
      checkDailyReset();
      
      btnRefresh.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span>';
      gridContainer.innerHTML = '<div class="status-msg">Mengambil data tren terbaru dari internet...</div>';

      const selectedSub = subredditSelect.value;
      const endpoint = `https://www.reddit.com/r/${selectedSub}/hot.json?limit=25`;

      try {
        const response = await fetch(endpoint);
        if (!response.ok) throw new Error('Gagal terhubung ke server API.');
        
        const data = await response.json();
        const posts = data.data.children;

        gridContainer.innerHTML = ''; // Clear container

        let count = 0;
        posts.forEach(item => {
          const post = item.data;

          // Hanya ambil postingan berupa gambar (bukan teks/video) & bukan NS-FW
          if (post.post_hint === 'image' && !post.over_18) {
            count++;
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <img class="card-img" src="${post.url}" alt="${post.title}" loading="lazy">
              <div class="card-content">
                <h3 class="card-title">${post.title}</h3>
                <div>
                  <div class="card-meta">
                    <span>👍 ${post.ups.toLocaleString()} Upvotes</span>
                    <span>💬 ${post.num_comments.toLocaleString()} Komentar</span>
                  </div>
                  <a href="https://reddit.com${post.permalink}" target="_blank" class="card-link">Lihat di Reddit &rarr;</a>
                </div>
              </div>
            `;
            gridContainer.appendChild(card);
          }
        });

        if (count === 0) {
          gridContainer.innerHTML = '<div class="status-msg">Tidak ada konten gambar ditemukan saat ini.</div>';
        }

      } catch (error) {
        gridContainer.innerHTML = `<div class="status-msg" style="color: #f87171;">Terjadi kesalahan: ${error.message}</div>`;
      } finally {
        btnRefresh.disabled = false;
        btnText.textContent = 'Refresh';
      }
    }

    // Event Listeners
    btnRefresh.addEventListener('click', fetchTrending);
    subredditSelect.addEventListener('change', fetchTrending);

    // Cek reset setiap kali tab menjadi aktif lagi
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        checkDailyReset();
      }
    });

    // Inisialisasi awal saat halaman dibuka
    updateDateLabel();
    fetchTrending();
  </script>
</body>
</html>
